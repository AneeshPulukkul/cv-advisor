name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: pytest -q
      - run: python examples/fraud_imbalanced.py
      - run: python examples/patients_grouped.py
      - run: python examples/housing_spatial.py
      - run: python examples/devices_temporal.py
      - run: pip-audit
        continue-on-error: true # report-only: fails loudly without blocking on new CVEs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
